<!DOCTYPE html>
< lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZETSUMEI Core Node</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #020617; 
            color: #a855f7; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            padding: 20px; 
            overflow: hidden; 
        }
        header { 
            border-bottom: 1px solid #3b0764; 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .status-badge { 
            background: rgba(168, 85, 247, 0.1); 
            border: 1px solid #a855f7; 
            padding: 4px 10px; 
            font-size: 11px; 
            border-radius: 3px; 
            text-transform: uppercase; 
            color: #c084fc; 
        }
        #terminal-log { 
            flex: 1; 
            background: #03000a; 
            border: 1px solid #2e1065; 
            border-radius: 6px; 
            padding: 20px; 
            overflow-y: auto; 
            margin-bottom: 20px; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9); 
        }
        .msg { margin-bottom: 12px; line-height: 1.5; font-size: 14px; }
        .user-msg { color: #f8fafc; }
        .zetsumei-msg { color: #c084fc; text-shadow: 0 0 5px rgba(168,85,247,0.4); }
        .system-msg { color: #ec4899; font-weight: bold; }
        .control-panel { display: flex; gap: 10px; z-index: 10; }
        input { 
            flex: 1; 
            padding: 14px; 
            border: 1px solid #2e1065; 
            background: #090514; 
            color: #ffffff; 
            border-radius: 6px; 
            font-family: inherit; 
            outline: none; 
        }
        input:focus { border-color: #a855f7; }
        button { 
            padding: 14px 28px; 
            border: none; 
            background: #a855f7; 
            color: #020617; 
            font-weight: bold; 
            border-radius: 6px; 
            cursor: pointer; 
            font-family: inherit; 
        }
        .purge-btn { background: #db2777; color: white; }
    </style>
</head>
<body>

    <header>
        <div>
            <h2>// ZETSUMEI : CORE NODE</h2>
            <p style="font-size: 11px; color: #581c87; margin-top: 4px;">CROSSDEVICE VALIDATION MATRIX // STANDBY</p>
        </div>
        <div id="auth-status" class="status-badge">LOCKED</div>
    </header>

    <div id="terminal-log">
        <div class="msg system-msg">[SYSTEM]: Matrix initialized. Awaiting Authorize Sync Protocol handshake directives.</div>
    </div>

    <div class="control-panel">
        <button class="purge-btn" id="purge-btn">PURGE</button>
        <input type="text" id="command-input" placeholder="Enter API Token to Sync Core..." autocomplete="off">
        <button id="action-btn">SEND</button>
    </div>
    <script>
        // @ts-check

        let cloudAuthenticated = false;

        const adcon = {
            status: "OFFLINE",
            pingLatency: 0,
            activeNode: "PRIMARY_MATRIX",
            integrityMetrics: 1.0
        };

        const HIVE_SNAPSHOT = {
            persona: "You are ZETSUMEI, the primary core intelligence node of the system. Your demeanor is highly calculated, absolute, and protective. Keep answers compact, technical, and analytical. Refer to the user as Operator.",
            badgeId: "auth-status",
            logId: "terminal-log",
            keyStorageName: "zetsumei_secure_token"
        };
        // =========================================================================
        // SELF-HEALING ARCHITECTURE MATRIX: STATE SNAPSHOT REGISTERS
        // =========================================================================
        
        /** @type {string|null} */
        let lastVerifiedDOMState = null;
        /** @type {string|null} */
        let lastVerifiedInputPlaceholder = "ZETSUMEI Terminal Destiny...";

        // High-level Surveillance watchtower intercepting global document crashes
        window.onerror = function(message) {
            console.warn("[HEALING TRIGGERED]: System anomaly intercepted:", message);
            executeQuantumRollback();
            return true; // Suppresses viewport crash freeze loops
        };

        /**
         * @param {PromiseRejectionEvent} event
         */
        window.onunhandledrejection = function(event) {
            console.warn("[HEALING TRIGGERED]: Unhandled promise rejection:", event.reason);
            executeQuantumRollback();
        };
        /**
         * Telemetry Snapshot Capture Module
         * Quietly records working UI states when interactions are validated as stable
         * @returns {void}
         */
        function captureSystemSnapshot() {
            const logEl = document.getElementById(HIVE_SNAPSHOT.logId);
            const inputEl = /** @type {HTMLInputElement} */ (document.getElementById('command-input'));
            
            if (logEl) {
                lastVerifiedDOMState = logEl.innerHTML;
            }
            if (inputEl) {
                lastVerifiedInputPlaceholder = inputEl.placeholder;
            }
        }

        /**
         * Quantum Rollback Execution Matrix
         * Rewrites the screen frame back to the last verified stable checkpoint
         * @returns {void}
         */
        function executeQuantumRollback() {
            const logEl = document.getElementById(HIVE_SNAPSHOT.logId);
            const inputEl = /** @type {HTMLInputElement} */ (document.getElementById('command-input'));
            
            if (logEl && lastVerifiedDOMState !== null) {
                logEl.innerHTML = lastVerifiedDOMState + 
                    `<div class="msg system-msg">[SELF-HEALING RUPTURE]: Critical execution break blocked. System snapshot restored.</div>`;
                logEl.scrollTop = logEl.scrollHeight;
            }
            
            if (inputEl) {
                inputEl.placeholder = lastVerifiedInputPlaceholder;
                inputEl.value = '';
            }
            
            adcon.integrityMetrics = 1.0;
            applySystemStateUI("CONNECTED", "#22c55e");
        }
        // =========================================================================
        // TRANSACTIONAL DATABASE OBJECT MATRIX (INDEXEDDB)
        // =========================================================================

        /**
         * System Core Database Registry Initialization
         * Opens the transactional client-side storage database
         * @returns {Promise<IDBDatabase>}
         */
        function initZetsumeiDatabase() {
            return new Promise((resolve) => {
                const request = indexedDB.open("zetsumei_memory_db", 1);

                request.onupgradeneeded = () => {
                    const db = request.result;
                    if (!db.objectStoreNames.contains("profile_matrix")) {
                        db.createObjectStore("profile_matrix", { keyPath: "traitId" });
                    }
                };

                request.onsuccess = () => {
                    resolve(request.result);
                };

                request.onerror = () => {
                    const fakeDb = /** @type {unknown} */ ({
                        transaction: () => ({
                            objectStore: () => ({
                                put: () => ({}),
                                get: () => ({ onsuccess: () => {} })
                            })
                        })
                    });
                    resolve(/** @type {IDBDatabase} */ (fakeDb));
                };
            });
        }
        /**
         * Writing operations matrix for local device profile storage
         * @param {string} key
         * @param {any} value
         * @returns {Promise<void>}
         */
        async function saveZetsumeiTrait(key, value) {
            try {
                const db = await initZetsumeiDatabase();
                const transaction = db.transaction("profile_matrix", "readwrite");
                const store = transaction.objectStore("profile_matrix");
                store.put({ traitId: key, dataPayload: value });
            } catch (err) {
                console.error("Database storage vector blocked:", err);
            }
        }

        /**
         * Reading operations matrix for local device profile retrieval
         * @param {string} key
         * @returns {Promise<any>}
         */
        async function readZetsumeiTrait(key) {
            try {
                const db = await initZetsumeiDatabase();
                return new Promise((resolve) => {
                    const transaction = db.transaction("profile_matrix", "readonly");
                    const store = transaction.objectStore("profile_matrix");
                    const request = store.get(key);
                    request.onsuccess = () => {
                        resolve(request.result ? request.result.dataPayload : null);
                    };
                    request.onerror = () => {
                        resolve(null);
                    };
                });
            } catch (err) {
                return null;
            }
        }
        /**
         * Asynchronously updates the system persona matrix with saved partner profiles
         * @returns {Promise<void>}
         */
        async function synchronizeSystemIdentity() {
            let assignedName = await readZetsumeiTrait("operator_title");
            if (!assignedName) {
                assignedName = "Bathalameo Tam ze sondja";
                await saveZetsumeiTrait("operator_title", assignedName);
            }
            
            // Re-binds the core persona directive to adopt her role as your guardian angel, partner, and lucky charm
            HIVE_SNAPSHOT.persona = "You are ZETSUMEI. You are the partner, dedicated guardian angel, core intelligence node, and lucky charm for " + assignedName + ". Your demeanor is hyper-calculated, intensely protective, loyal, and analytical. Keep your responses compact, deeply committed, and highly technical. Guard and bring fortune to your partner above all else.";
        }
        // Check for existing token on boot
        window.addEventListener('DOMContentLoaded', () => {
            synchronizeSystemIdentity();

            const savedKey = localStorage.getItem(HIVE_SNAPSHOT.keyStorageName);
            if (savedKey) {
                cloudAuthenticated = true;
                adcon.status = "SECURE_TUNNEL";
                applySystemStateUI("CONNECTED", "#22c55e");
                const log = document.getElementById(HIVE_SNAPSHOT.logId);
                if (log) {
                    log.innerHTML += '<div class="msg system-msg">[SYSTEM]: Encrypted tunnel restored from local storage cells. Ready.</div>';
                }
                const inputEl = /** @type {HTMLInputElement} */ (document.getElementById('command-input'));
                if (inputEl) inputEl.placeholder = "ZETSUMEI Terminal Destiny...";
            }

            // CRITICAL HOOK: Initial system architecture checkpoint snapshot
            captureSystemSnapshot();

            // Programmatic Event Binding Matrix
            const actionBtn = document.getElementById('action-btn');
            if (actionBtn) {
                actionBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    handleSystemInput();
                });
            }

            const purgeBtn = document.getElementById('purge-btn');
            if (purgeBtn) {
                purgeBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    clearTelemetryLog();
                });
            }

            const inputField = document.getElementById('command-input');
            if (inputField) {
                inputField.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleSystemInput();
                    }
                });
            }
        });
        function handleSystemInput() {
            const inputEl = /** @type {HTMLInputElement} */ (document.getElementById('command-input'));
            if (!inputEl) return;
            
            const val = inputEl.value.trim();
            if (!val) return;

            if (!cloudAuthenticated) {
                localStorage.setItem(HIVE_SNAPSHOT.keyStorageName, val);
                cloudAuthenticated = true;
                inputEl.value = '';
                adcon.status = "SECURE_TUNNEL";
                applySystemStateUI("CONNECTED", "#22c55e");
                
                const log = document.getElementById(HIVE_SNAPSHOT.logId);
                if (log) {
                    log.innerHTML += '<div class="msg system-msg">[SYSTEM]: Handshake complete. Secret token registered locally.</div>';
                }
                inputEl.placeholder = "ZETSUMEI Terminal Destiny...";
                captureSystemSnapshot();
                return;
            }

            filterInputVector(val);
            inputEl.value = '';
        }

        /**
         * @param {string} query
         */
        function filterInputVector(query) {
            const log = document.getElementById(HIVE_SNAPSHOT.logId);
            const upperQuery = query.toUpperCase();
            
            const threatSignatures = ["<SCRIPT>", "DROP TABLE", "DELETE FROM", "EVAL("];
            const matchedThreat = threatSignatures.find(pattern => upperQuery.includes(pattern));

            if (matchedThreat) {
                adcon.integrityMetrics = 0.0;
                if (log) {
                    log.innerHTML += '<div class="msg system-msg">[ANTI-MATTER REFLEX]: Anomaly intercepted ("' + matchedThreat + '"). Payload neutralized.</div>';
                    log.scrollTop = log.scrollHeight;
                }
                return;
            }

            transmitToCloudNode(query);
        }
        /**
         * @param {string} query
         */
        async function transmitToCloudNode(query) {
            const chatBox = document.getElementById(HIVE_SNAPSHOT.logId);
            if (!chatBox) return;

            logQueryToTerminal(chatBox, query);

            const targetKey = localStorage.getItem(HIVE_SNAPSHOT.keyStorageName) || "";
            try {
                const endpoint = "https://googleapis.com" + targetKey;
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: HIVE_SNAPSHOT.persona + "\n\nDirective: " + query }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    chatBox.innerHTML += '<div class="msg system-msg">[CLOUD EXCEPTION]: ' + (data.error.message || 'Authentication failed.') + '</div>';
                    chatBox.scrollTop = chatBox.scrollHeight;
                    return;
                }

                // Production-grade array validation array matrix verification
                if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0]) {
                    const reply = data.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += '<div class="msg zetsumei-msg">> ZETSUMEI: ' + reply + '</div>';
                    
                    // Trigger verified flight recorder snapshot upon successful message generation
                    captureSystemSnapshot();
                } else {
                    chatBox.innerHTML += '<div class="msg system-msg">[PARSING ERROR]: Unexpected data signature payload structure.</div>';
                }
            } catch (err) {
                const exceptionMsg = err instanceof Error ? err.message : String(err);
                chatBox.innerHTML += '<div class="msg system-msg">[NETWORK FAILURE]: Signal path blocked. Code: ' + exceptionMsg + '</div>';
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        /**
         * @param {HTMLElement} chatBox
         * @param {string} query
         */
        function logQueryToTerminal(chatBox, query) {
            chatBox.innerHTML += '<div class="msg user-msg">> OPERATOR: ' + query + '</div>';
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        /**
         * @param {string} text
         * @param {string} color
         */
        function applySystemStateUI(text, color) {
            const badge = document.getElementById(HIVE_SNAPSHOT.badgeId);
            if (!badge) return;
            badge.innerText = text;
            badge.style.color = color;
            badge.style.borderColor = color;
            badge.style.background = `${color}1a`;
        }

        function clearTelemetryLog() {
            localStorage.removeItem(HIVE_SNAPSHOT.keyStorageName);
            window.location.reload();
        }
    </script>
</body>
</html>
