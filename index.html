<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZETSUMEI Core Node</title>
        <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020617;
            color: #a855f7;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        header {
            border-bottom: 1px solid #3b0764;
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-badge {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid #a855f7;
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 3px;
            text-transform: uppercase;
            color: #c084fc;
        }
        #terminal-log {
            flex: 1;
            background: #03000a;
            border: 1px solid #2e1065;
            border-radius: 6px;
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .msg { margin-bottom: 12px; line-height: 1.4; font-size: 13px; }
        .user-msg { color: #f8fafc; }
        .zetsumei-msg { color: #c084fc; }
        .system-msg { color: #ec4899; font-weight: bold; }
        .control-panel { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #2e1065;
            background: #090514;
            color: #ffffff;
            border-radius: 6px;
            font-family: inherit;
            outline: none;
        }
        input:focus { border-color: #a855f7; }
        button {
            padding: 14px 28px;
            border: none;
            background: #a855f7;
            color: #020617;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        .purge-btn { background: #db2777; color: white; }
    </style>
</head>
<body>

    <header>
        <div>
            <h2>// ZETSUMEI : CORE NODE</h2>
            <p style="font-size: 11px; color: #8b5cf6;">CROSSDEVICE VALIDATION MATRIX // STANDBY</p>
        </div>
        <div id="auth-status" class="status-badge">LOCKED</div>
    </header>

    <div id="terminal-log">
        <div class="msg system-msg">[SYSTEM]: Matrix initialized. Awaiting Authorize Sync Protocol handshake directives.</div>
    </div>

    <div class="control-panel">
        <button class="purge-btn" id="purge-btn">PURGE</button>
        <input type="text" id="command-input" placeholder="Enter handshake directive..." autocomplete="off">
        <button id="action-btn">SEND</button>
    </div>
        <script>
                // // =========================================================================
        // // SELF-HEALING ARCHITECTURE MATRIX NETS
        // // =========================================================================
        let lastVerifiedDOMState = null;

        /**
         * Hooks global window runtime errors.
         * @param {string} message - Error description text.
         * @param {string} source - Script URL string origin.
         * @param {number} lineno - Active code line fault index.
         * @returns {boolean} True prevents standard browser error tracking.
         */
        window.onerror = function(message, source, lineno) {
            console.warn("[HEALING TRIGGERED]: Exception " + message + " inside " + source + " at line " + lineno);
            executeQuantumRollback();
            return true;
        };

        window.onunhandledrejection = function() {
            console.warn("[HEALING TRIGGERED]: Promise fault detected.");
            executeQuantumRollback();
        };

        function executeQuantumRollback() {
            const logEl = document.getElementById('terminal-log');
            if (logEl && lastVerifiedDOMState) {
                logEl.innerHTML = lastVerifiedDOMState;
                appendTerminalMsg("[SYSTEM HEALED]: Core structure recovered from rollback buffer.", "system-msg");
            }
        }
                  // // =========================================================================
        // // TRANSACTIONAL DATABASE OBJECT MODULES (INDEXEDDB)
        // // =========================================================================
        const DB_NAME = "zetsumei_memory_db";
        const STORE_NAME = "profile_matrix";

        function initZetsumeiDatabase() {
            return new Promise((resolve) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    e.target.result.createObjectStore(STORE_NAME);
                };
                request.onsuccess = () => resolve(true);
                request.onerror = () => resolve(false);
            });
        }
                         // // =========================================================================
        // // INLINE STORAGE TELEMETRY ENGINE
        // // =========================================================================
        async function updateStorageTelemetry() {
            const metricDisplay = document.getElementById('auth-status');
            if (!metricDisplay) return;
            
            if (navigator.storage && navigator.storage.estimate) {
                try {
                    const { usage } = await navigator.storage.estimate();
                    const usedMB = (usage / (1024 * 1024)).toFixed(4);
                    metricDisplay.textContent = `SYS OK | ${usedMB}MB`;
                } catch (e) {
                    metricDisplay.textContent = "SYS DATA ERR";
                }
            } else {
                metricDisplay.textContent = "ONLINE";
            }
        }

                          // // =========================================================================
        // // INTERFACE UI LOG PRINTING MODULE
        // // =========================================================================
        function appendTerminalMsg(text = "", className = "") {
            const logWindow = document.getElementById('terminal-log');
            if (!logWindow) return;
            
            const msgNode = document.createElement('div');
            msgNode.className = `msg ${className}`;
            msgNode.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            
            logWindow.appendChild(msgNode);
            logWindow.scrollTop = logWindow.scrollHeight;
            
            lastVerifiedDOMState = logWindow.innerHTML; 
        }

                                // // =========================================================================
        // // EDGE GATEWAY CONNECTOR ROUTER PROTOCOL
        // // =========================================================================
        const SECURE_ENDPOINT = "https://workers.dev";

        async function executeZetsumeiQuery() {
            const inputEl = document.getElementById('command-input');
            if (!inputEl) return;
            
            const promptText = inputEl.value.trim();
            if (!promptText) return;

            appendTerminalMsg(`Bathalameo: ${promptText}`, 'user-msg');
            inputEl.value = '';
            
            const logWindow = document.getElementById('terminal-log');
            const trackingNode = document.createElement('div');
            trackingNode.className = 'msg system-msg';
            trackingNode.style.opacity = '0.5';
            trackingNode.textContent = `[${new Date().toLocaleTimeString()}] ZETSUMEI: Synchronizing reasoning layers...`;
            logWindow.appendChild(trackingNode);
            logWindow.scrollTop = logWindow.scrollHeight;

            try {
                // Android-Sanitized Text Fetch Wire
                const frameResponse = await fetch(SECURE_ENDPOINT, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: promptText })
                });

                trackingNode.remove();

                if (!frameResponse.ok) throw new Error(`GATEWAY ERROR: ${frameResponse.status}`);
                
                const payloadData = await frameResponse.json();
                appendTerminalMsg(`ZETSUMEI: ${payloadData.reply || payloadData.error}`, 'zetsumei-msg');

            } catch (networkError) {
                trackingNode.remove();
                appendTerminalMsg(`[SIGNAL INTERRUPTED]: ${networkError.message}`, 'system-msg');
            }
        }

                  // // =========================================================================
        // // RUNTIME LIFECYCLE INITIALIZATION LOOPS
        // // =========================================================================
        window.addEventListener('DOMContentLoaded', async () => {
            // 1. Initialize local persistent memory cell registry
            await initZetsumeiDatabase();
            
            // 2. Refresh client-side telemetry byte allocations
            await updateStorageTelemetry();
            
            const actionButton = document.getElementById('action-btn');
            const inputField = document.getElementById('command-input');
            const purgeBtn = document.getElementById('purge-btn');

            // 3. Programmatically bind action nodes to interface targets
            if (actionButton) {
                actionButton.addEventListener('click', executeZetsumeiQuery);
            }
            if (inputField) {
                inputField.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') {
                        executeZetsumeiQuery();
                    }
                });
            }
            if (purgeBtn) {
                purgeBtn.addEventListener('click', () => {
                    const logEl = document.getElementById('terminal-log');
                    if (logEl) {
                        logEl.innerHTML = '<div class="msg system-msg">[MEMPOOL CLEANSED]: Active log buffer cleared.</div>';
                        updateStorageTelemetry();
                    }
                });
            }
        });
    </script>
</body>
</html>
